# Dedicated local project for the destructive Phase 6 database harness.
# This is intentionally separate from the repository's normal Supabase config.
project_id = "lockdin-db-harness"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false
port = 55429

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 55423

[local_smtp]
enabled = false
port = 55424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[edge_runtime]
enabled = false
inspector_port = 55483

[analytics]
enabled = false
port = 55427
