openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: A-Level Revision Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: subjects
    description: Public read-only shared subject catalogue (importer/admin-managed reference data)
  - name: syllabus
    description: Syllabus reference reads; per-user progress updates are temporarily unavailable
  - name: tasks
    description: Authenticated revision task operations (user-owned)
  - name: pastPaperAttempts
    description: Authenticated user-owned past-paper attempt operations
  - name: examDates
    description: Authenticated user-owned exam-date operations (SELECT/INSERT/DELETE; no UPDATE)
  - name: dashboard
    description: Authenticated dashboard summary (user-owned tasks; neutral syllabus placeholders)
  - name: progress
    description: Authenticated progress overview (user-owned tasks; neutral syllabus placeholders)
  - name: profile
    description: Authenticated profile and atomic onboarding operations
  - name: userSubjects
    description: Authenticated durable subject membership for the current user

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List the shared public subject catalogue
      description: |
        Returns importer/admin-managed reference subjects. Not user-scoped.
        Progress, task-count, and past-paper fields are neutral placeholders
        (syllabusProgress/topicsCompleted/topicsInProgress = 0; upcomingTasksCount = 0;
        recent paper fields null) until per-user ownership exists for those features.
      responses:
        "200":
          description: Shared catalogue subjects with neutral placeholder enrichment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Disabled — subject catalogue is read-only shared reference data
      description: |
        Ordinary users must not insert into the global catalogue.
        Subjects are populated by the syllabus importer / admin processes.
        No admin role is exposed in this API version. No database write is performed.
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "403":
          description: Catalogue writes are forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /subjects/{subjectId}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get a shared catalogue subject with neutral placeholder enrichment
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject detail (progress/task/paper fields are placeholders)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "404":
          description: Not found
    delete:
      operationId: deleteSubject
      tags: [subjects]
      summary: Disabled — subject catalogue is read-only shared reference data
      description: |
        Ordinary users must not delete catalogue rows. No database delete is performed.
      deprecated: true
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "403":
          description: Catalogue deletes are forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /subjects/{subjectId}/syllabus:
    get:
      operationId: getSubjectSyllabus
      tags: [subjects]
      summary: Get syllabus reference structure for a subject
      description: |
        Returns units, topic titles, and learning outcomes from shared reference data.
        When a valid Bearer token is provided, each topic's status and notes are merged
        from the caller's topic_progress rows. Missing progress rows default to
        not_started with null notes. Unauthenticated callers receive the same defaults.
        Progress fields come from topic_progress, not shared catalogue columns.
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Syllabus units with topics (caller progress when authenticated)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyllabusUnit"
        "401":
          description: Authorization header present but invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /subjects/{subjectId}/performance:
    get:
      operationId: getSubjectPerformance
      tags: [subjects]
      summary: Get caller-owned past-paper performance for one subject
      description: |
        Requires Bearer auth. Latest, average, best, count, trend and component
        breakdown are calculated only from the caller's attempts.
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Caller-owned subject performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectPerformance"
        "404":
          description: Subject not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /subjects/{subjectId}/assessment-components:
    get:
      operationId: listAssessmentComponents
      tags: [subjects]
      summary: List assessment components (papers) for a subject's current syllabus version, for the Log Paper Component dropdown
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of assessment components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentComponent"

  /syllabus-topics/{topicId}:
    patch:
      operationId: updateSyllabusTopic
      tags: [syllabus]
      summary: Upsert the authenticated user's progress for a syllabus topic
      description: |
        Upserts the caller's topic_progress row for the given shared topic.
        Ownership is derived from the verified Bearer token; client-supplied
        userId/user_id fields are rejected. Setting status to not_started with
        an empty/absent note deletes the caller's row (reset-to-default).
        Shared syllabus_topics rows are never mutated.
      security:
        - bearerAuth: []
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyllabusTopicUpdate"
      responses:
        "200":
          description: Updated caller topic progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusTopicProgress"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: resetSyllabusTopicProgress
      tags: [syllabus]
      summary: Reset the authenticated user's progress for a syllabus topic
      description: |
        Deletes the caller's topic_progress row for the topic. Shared syllabus
        topics are never mutated. Absence of a row is already the default state.
      security:
        - bearerAuth: []
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Caller progress reset (row deleted if present)
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List revision tasks for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [today, upcoming, completed, all]
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new revision task owned by the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Task not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task owned by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Task not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /past-paper-attempts:
    get:
      operationId: listPastPaperAttempts
      tags: [pastPaperAttempts]
      summary: List the authenticated user's past-paper attempts
      description: |
        Returns only caller-owned attempts, newest first. The optional subjectId
        filter remains inside the caller ownership boundary.
      security:
        - bearerAuth: []
      parameters:
        - name: subjectId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Caller-owned past-paper attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PastPaperAttempt"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createPastPaperAttempt
      tags: [pastPaperAttempts]
      summary: Log a caller-owned past-paper attempt
      description: |
        Ownership is derived from the verified Bearer token. The client cannot
        choose user_id, and percentage is calculated from score / totalMarks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PastPaperAttemptInput"
      responses:
        "201":
          description: Attempt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PastPaperAttempt"
        "400":
          description: Invalid paper identity, year, score, marks, date, or ownership field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /past-paper-attempts/{pastPaperAttemptId}:
    delete:
      operationId: deletePastPaperAttempt
      tags: [pastPaperAttempts]
      summary: Delete a caller-owned past-paper attempt
      description: Foreign-owned and missing IDs both return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: pastPaperAttemptId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Attempt deleted
        "404":
          description: Attempt not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /exam-dates:
    get:
      operationId: listExamDates
      tags: [examDates]
      summary: List the authenticated user's exam dates
      description: |
        Returns only caller-owned exam dates in chronological order
        (date ASC, id ASC), with subject display fields enriched from the
        shared catalogue.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caller-owned exam dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamDate"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    post:
      operationId: createExamDate
      tags: [examDates]
      summary: Create a caller-owned exam date
      description: |
        Ownership is derived from the verified Bearer token. Ownership fields
        in the request body (userId, user_id, ownerId, owner_id) are rejected.
        PATCH/UPDATE is out of scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamDateInput"
      responses:
        "201":
          description: Exam date created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamDate"
        "400":
          description: Invalid subject, paper code, date, or ownership field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /exam-dates/{examDateId}:
    delete:
      operationId: deleteExamDate
      tags: [examDates]
      summary: Delete a caller-owned exam date
      description: Foreign-owned and missing IDs both return 404.
      security:
        - bearerAuth: []
      parameters:
        - name: examDateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Exam date deleted
        "404":
          description: Exam date not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /user-subjects:
    get:
      operationId: listCurrentUserSubjects
      tags: [userSubjects]
      summary: List the authenticated user's selected subjects
      description: Returns only the caller's durable memberships with shared display data.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's selected subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSubjectMembership"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    put:
      operationId: replaceCurrentUserSubjects
      tags: [userSubjects]
      summary: Atomically replace the authenticated user's selected subjects
      description: |
        Replaces the caller's membership set with 1–5 distinct catalogue subjects.
        Existing tasks and other owned activity are not deleted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSubjectSelectionInput"
      responses:
        "200":
          description: Replaced current user's selected subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSubjectMembership"
        "400":
          description: Invalid subject selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /profile:
    get:
      operationId: getCurrentProfile
      tags: [profile]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      operationId: updateCurrentProfile
      tags: [profile]
      summary: Update allowed profile fields for the authenticated user
      description: |
        Allowed fields: fullName, level, examSession.
        username and onboardedAt cannot be changed through this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /profile/complete-onboarding:
    post:
      operationId: completeCurrentUserOnboarding
      tags: [profile]
      summary: Complete onboarding atomically for the authenticated user
      description: |
        Sets username and onboarded_at, persists durable membership, and creates
        one starter task per selected subject (1–5) via lockdin_complete_onboarding.
        Idempotent when retried with the same username after success.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOnboardingInput"
      responses:
        "200":
          description: Onboarded profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Username unavailable or onboarding already completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard overview for the authenticated user
      description: |
        Task metrics are Auth-scoped. subjectProgressSummary.syllabusProgress is
        always 0 (neutral placeholder). recentPerformance is calculated from the
        caller's past-paper attempts; upcomingExams lists the caller's exam dates
        with date >= today (no upper date window; Dashboard UI caps display at 4).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /progress/overview:
    get:
      operationId: getProgressOverview
      tags: [progress]
      summary: Get progress analytics for the authenticated user
      description: |
        Task completion metrics are Auth-scoped. Syllabus completion is computed
        from the caller's topic_progress against enrolled subjects' topic counts.
        Past-paper totals count only the caller's owned attempts.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Progress overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressOverview"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token (Authorization Bearer). Required for task-owned routes.

  schemas:
    ErrorMessage:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Profile:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        level:
          type: ["string", "null"]
        examSession:
          type: ["string", "null"]
        onboardedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - fullName
        - username
        - level
        - examSession
        - onboardedAt
        - createdAt
        - updatedAt

    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        level:
          type: string
          minLength: 1
          maxLength: 80
        examSession:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false

    CompleteOnboardingInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        username:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[a-z0-9_]{3,24}$"
        level:
          type: string
          minLength: 1
          maxLength: 80
        examSession:
          type: string
          minLength: 1
          maxLength: 80
        subjectIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: integer
            minimum: 1
      required:
        - fullName
        - username
        - level
        - examSession
        - subjectIds
      additionalProperties: false

    UserSubjectSelectionInput:
      type: object
      properties:
        subjectIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: integer
            minimum: 1
      required:
        - subjectIds
      additionalProperties: false

    UserSubjectMembership:
      type: object
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        syllabusVersion:
          $ref: "#/components/schemas/UserSubjectSyllabusVersion"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - subject
        - syllabusVersion
        - createdAt
        - updatedAt

    UserSubjectSyllabusVersion:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        examBoard:
          type: string
        qualification:
          type: string
      required:
        - id
        - label
        - examBoard
        - qualification

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SubjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
      required:
        - name
        - code
        - color

    Subject:
      type: object
      description: |
        Shared catalogue subject. User-specific progress, task-count, and past-paper
        fields remain neutral placeholders on this public catalogue response.
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        color:
          type: string
        syllabusProgress:
          type: number
          description: Neutral placeholder; always 0 (not derived from shared topic status)
        topicsTotal:
          type: integer
          description: Count of syllabus topics in the shared catalogue for this subject
        topicsCompleted:
          type: integer
          description: Neutral placeholder; always 0
        topicsInProgress:
          type: integer
          description: Neutral placeholder; always 0
        upcomingTasksCount:
          type: integer
          description: Neutral placeholder; always 0 (not user-task derived)
        recentPaperScore:
          type: ["number", "null"]
          description: Neutral placeholder; always null on shared catalogue responses
        recentPaperLabel:
          type: ["string", "null"]
          description: Neutral placeholder; always null on shared catalogue responses
      required:
        - id
        - name
        - code
        - color
        - syllabusProgress
        - topicsTotal
        - topicsCompleted
        - topicsInProgress
        - upcomingTasksCount
        - recentPaperScore
        - recentPaperLabel

    SyllabusUnit:
      type: object
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        title:
          type: string
        orderIndex:
          type: integer
        topics:
          type: array
          items:
            $ref: "#/components/schemas/SyllabusTopic"
      required:
        - id
        - subjectId
        - title
        - orderIndex
        - topics

    SyllabusTopic:
      type: object
      description: |
        Shared syllabus topic reference with caller-owned progress fields merged
        when authenticated. Missing topic_progress rows default to not_started
        and null notes. Progress fields come from topic_progress only.
      properties:
        id:
          type: integer
        unitId:
          type: integer
        subjectId:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, completed]
          description: Caller-owned progress status; defaults to not_started
        notes:
          type: ["string", "null"]
          description: Caller-owned notes; defaults to null
        orderIndex:
          type: integer
        learningOutcomes:
          type: array
          items:
            type: string
      required:
        - id
        - unitId
        - subjectId
        - title
        - status
        - notes
        - orderIndex
        - learningOutcomes

    SyllabusTopicUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [not_started, in_progress, completed]
        notes:
          type: ["string", "null"]
          maxLength: 2000
      required:
        - status

    SyllabusTopicProgress:
      type: object
      description: Authenticated caller's progress for one shared syllabus topic
      properties:
        topicId:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, completed]
        notes:
          type: ["string", "null"]
      required:
        - topicId
        - status
        - notes

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subjectId:
          type: integer
        subjectName:
          type: string
        subjectColor:
          type: string
        topicId:
          type: ["integer", "null"]
        topicTitle:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        priority:
          type: string
          enum: [low, medium, high]
        estimatedMinutes:
          type: ["integer", "null"]
        completed:
          type: boolean
        completedAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - subjectId
        - subjectName
        - subjectColor
        - topicId
        - topicTitle
        - deadline
        - priority
        - estimatedMinutes
        - completed
        - completedAt
        - createdAt

    TaskInput:
