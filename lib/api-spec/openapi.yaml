          type: string
        priority:
          type: string
          enum: [low, medium, high]
        estimatedMinutes:
          type: integer

    PastPaperAttempt:
      type: object
      properties:
        id:
          type: integer
        subjectId:
          type: integer
        subjectName:
          type: string
        subjectColor:
          type: string
        componentId:
          type: ["integer", "null"]
        componentName:
          type: ["string", "null"]
        variant:
          type: ["integer", "null"]
        session:
          type: string
          enum: [May/June, Oct/Nov, Feb/Mar, Specimen]
        year:
          type: integer
