        paperLabel:
          type: string
        score:
          type: number
        totalMarks:
          type: integer
        percentage:
          type: number
        dateAttempted:
          type: string
        timeTakenMinutes:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
